name: Deploy to Server

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Frontend (GitHub Actions 7GB RAM)
        run: |
          cd client
          npm ci --silent
          npx vite build

      - name: Upload Frontend to Server
        run: |
          cd client
          tar -czf /tmp/client-dist.tar.gz dist
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          scp -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key -P 22 \
            /tmp/client-dist.tar.gz \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/client-dist.tar.gz

      - name: Deploy on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e
            cd /var/www/star-empathy-platform

            echo "=== 1/6 停服务释放内存 ==="
            pm2 stop star-api 2>/dev/null || true

            echo "=== 2/6 备份敏感文件 ==="
            cp server/.env /tmp/star-env 2>/dev/null || true
            cp server/data/stars.db /tmp/star-db 2>/dev/null || true

            echo "=== 3/6 拉取代码 ==="
            git fetch origin main
            git reset --hard origin/main

            if grep -rn "^<<<<<<< \|^=======\|^>>>>>>> " client/src/ server/src/ 2>/dev/null; then
              echo "❌ 检测到未解决的合并冲突标记，终止部署！"
              cp /tmp/star-env server/.env 2>/dev/null || true
              cp /tmp/star-db server/data/stars.db 2>/dev/null || true
              pm2 start star-api 2>/dev/null || true
              exit 1
            fi
            echo "✅ 无合并冲突标记"

            echo "=== 4/6 恢复敏感文件 ==="
            cp /tmp/star-env server/.env 2>/dev/null || true
            cp /tmp/star-db server/data/stars.db 2>/dev/null || true

            echo "=== 5/6 构建后端 (tsc) ==="
            cd server
            npm install --silent
            npx tsc
            npm prune --production --silent
            if [ ! -f .env ]; then
              echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" > .env
              echo "API_PORT=3000" >> .env
              echo "NODE_ENV=production" >> .env
              echo "ALLOWED_ORIGINS=${{ secrets.ALLOWED_ORIGINS }}" >> .env
            fi
            cd ..

            echo "=== 6/6 部署前端 + 重启 ==="
            rm -rf client/dist
            tar -xzf /tmp/client-dist.tar.gz -C client/
            rm /tmp/client-dist.tar.gz
            cd server
            pm2 restart star-api 2>/dev/null || pm2 start dist/src/index.js --name star-api
            pm2 save

            nginx -t && nginx -s reload

            echo "=== 部署完成 ==="
            free -h
            pm2 status